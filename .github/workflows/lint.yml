name: Lint and types

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check source formatting and Python types
        run: |
          cargo fmt --all --check
          python -m ruff check .
          python -m mypy
          gofmt -l sdk/go examples/go tests/sdk_contract/go > "$RUNNER_TEMP/gofmt.txt"
          cat "$RUNNER_TEMP/gofmt.txt"
          test ! -s "$RUNNER_TEMP/gofmt.txt"
          python -m pytest -q tests/test_release_versions.py
      - name: Check dashboard source and TypeScript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
      - name: Check shell scripts and workflows
        run: |
          shellcheck sdk/go/build.sh
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
