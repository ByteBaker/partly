name: Lint and types

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  lint:
    name: Lint and type checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install frontend check tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run basic checks and task runner tests
        run: |
          task lint PYTHON="$(command -v python)"
          python -m pytest -q tests/test_tasks.py
      - name: Check Python and TypeScript types
        run: |
          python -m mypy
          npm run typecheck
      - name: Check shell scripts and workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
