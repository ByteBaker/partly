name: Build and test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  build:
    name: Build SDKs and server
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build all components
        run: |
          rm -rf target/wheels
          maturin build --release --locked --manifest-path sdk/python/Cargo.toml --out target/wheels -i python3.14
          cargo build --release --locked -p partly-server
          sh sdk/go/build.sh
          cargo build --locked -p partly-sdk-contract
          node sdk/node/build.js
          (cd examples/go && go build -a -o ../../target/go-example .)
      - name: Bundle test inputs
        run: tar -czf target/test-inputs.tar.gz target/release/partly target/wheels sdk/go/native sdk/node/native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-inputs
          path: target/test-inputs.tar.gz
          if-no-files-found: error
          retention-days: 3

  tests:
    name: Unit and end-to-end tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARTLY_BINARY: ${{ github.workspace }}/target/release/partly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inputs
          path: target
      - name: Install the built SDKs
        run: |
          rm -rf target/wheels
          tar -xzf target/test-inputs.tar.gz
          python -m pip install target/wheels/*.whl
          npm ci --ignore-scripts --no-audit --no-fund
          cargo run --locked -p partly-e2e --features browser --bin partly-test-browsers -- --with-deps chromium
          cargo fetch --locked
      - name: Run unit tests
        run: |
          python -m mypy.stubtest partly._native
          cargo test --locked --workspace --all-features --exclude partly-e2e
          (cd sdk/go && go test -a -race ./...)
          (cd sdk/go/openfeature && go test -a -race ./...)
          node --test sdk/node/test/*.test.js
      - name: Test the installed SDKs and dashboard
        run: |
          python -m pytest -q
          cargo test --locked -p partly-e2e --features browser --test e2e -- --test-threads=4
      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failures-chromium
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
