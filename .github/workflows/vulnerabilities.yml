name: Vulnerabilities

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  audit:
    name: Audit ${{ matrix.ecosystem }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [rust, python, go, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.ecosystem == 'python'
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.ecosystem == 'go'
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.ecosystem == 'node'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Audit Rust dependencies
        if: matrix.ecosystem == 'rust'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Audit Python runtime and development dependencies
        if: matrix.ecosystem == 'python'
        run: |
          python -m pip install pip-audit==2.9.0 -r requirements-dev.txt
          python - <<'PY'
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("sdk/python/pyproject.toml").read_text())["project"]
          subprocess.run([sys.executable, "-m", "pip", "install", *project["dependencies"]], check=True)
          PY
          python -m pip freeze > "$RUNNER_TEMP/python-audit.txt"
          python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/python-audit.txt"
      - name: Audit Go dependencies and standard library
        if: matrix.ecosystem == 'go'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          for module in sdk/go examples/go tests/sdk_contract/go; do
            (cd "$module" && govulncheck ./...)
          done
      - name: Audit Node runtime and development packages
        if: matrix.ecosystem == 'node'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=low
