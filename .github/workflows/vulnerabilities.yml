name: Vulnerabilities

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  audit:
    name: Audit ${{ matrix.ecosystem }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [rust, python, go, node]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
        with:
          version: '3.53.1'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.ecosystem == 'python'
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.ecosystem == 'go'
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.ecosystem == 'node'
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Audit Rust dependencies
        if: matrix.ecosystem == 'rust'
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          task tools:rust-audit
          task audit:rust
      - name: Audit Python runtime and development dependencies
        if: matrix.ecosystem == 'python'
        run: |
          python -m pip install -r config/requirements-dev.txt
          task audit:python PYTHON="$(command -v python)"
      - name: Audit Go dependencies and standard library
        if: matrix.ecosystem == 'go'
        run: |
          task tools:go-audit
          task audit:go
      - name: Audit Node runtime and development packages
        if: matrix.ecosystem == 'node'
        run: |
          task audit:node
