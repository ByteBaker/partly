name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  build:
    uses: ./.github/workflows/build.yml

  compatibility:
    name: Minimum versions and other browsers
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PARTLY_BINARY: ${{ github.workspace }}/target/release/partly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go-version: "1.22.12"
          node-version: "22.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-inputs
          path: target
      - name: Install test inputs and check minimum toolchains
        run: |
          rm -rf target/wheels
          tar -xzf target/test-inputs.tar.gz
          python -m pip install target/wheels/*.whl
          npm ci --ignore-scripts --no-audit --no-fund
          cargo fetch --locked
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 check --locked --workspace --all-targets --all-features
          (cd sdk/go && go test -a -race ./...)
          node --test sdk/node/test/*.test.js
          python -m pytest -q tests/e2e/test_sdk_contract.py
      - name: Check Firefox and WebKit
        run: |
          python -m playwright install --with-deps firefox webkit
          for browser in firefox webkit; do
            PARTLY_BROWSER="$browser" python -m pytest -q tests/e2e/test_dashboard.py -k 'flag_modal_types_rules_and_in_place_saves or custom_dropdown_keyboard_commit_cancel_and_modal_escape or environment_dropdown_only_navigates_after_commit or unsaved_navigation_reload_and_modal_protection or browser_back_preserves_dirty_edits_and_forward_keeps_environment or dropdown_popup_fits_viewport_without_layout_shift_and_cancels_on_move'
          done

  notices:
    name: Dependency licenses
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check dependency notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked
          cargo fetch --locked
          cargo about generate --locked --offline --fail --config licenses/about.toml --manifest-path crates/partly-server/Cargo.toml --target x86_64-unknown-linux-musl --target aarch64-apple-darwin licenses/third-party.hbs --output-file licenses/THIRD_PARTY_NOTICES.txt 2>&1 | tee "$RUNNER_TEMP/server-licenses.log"
          cargo about generate --locked --offline --fail --config licenses/about.toml --manifest-path sdk/python/Cargo.toml --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin licenses/third-party.hbs --output-file sdk/python/THIRD_PARTY_NOTICES.txt 2>&1 | tee "$RUNNER_TEMP/sdk-licenses.log"
          for language in rust node; do
            cargo about generate --all-features --locked --offline --fail --config licenses/about.toml --manifest-path "sdk/$language/Cargo.toml" --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin licenses/third-party.hbs --output-file "sdk/$language/THIRD_PARTY_NOTICES.txt" 2>&1 | tee "$RUNNER_TEMP/$language-licenses.log"
          done
          cargo about generate --locked --offline --fail --config licenses/about.toml --manifest-path crates/partly-ffi/Cargo.toml --target x86_64-unknown-linux-gnu --target aarch64-apple-darwin licenses/third-party.hbs --output-file sdk/go/THIRD_PARTY_NOTICES.txt 2>&1 | tee "$RUNNER_TEMP/go-licenses.log"
          if grep -q 'failed to validate all files specified in clarification' "$RUNNER_TEMP/"*-licenses.log; then
            exit 1
          fi
          git diff --exit-code -- licenses/THIRD_PARTY_NOTICES.txt sdk/*/THIRD_PARTY_NOTICES.txt

  artifacts:
    needs: [build, compatibility, notices]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            binary-target: x86_64-unknown-linux-musl
            wheel-target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - runner: macos-14
            binary-target: aarch64-apple-darwin
            wheel-target: aarch64-apple-darwin
            manylinux: ""
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the Rust target
        env:
          BINARY_TARGET: ${{ matrix.binary-target }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add "$BINARY_TARGET"
          for language in python go node; do
            cmp "$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html" "sdk/$language/RUST_STDLIB_NOTICES.html"
          done
      - name: Install the Linux static linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build the standalone server
        env:
          BINARY_TARGET: ${{ matrix.binary-target }}
        run: cargo build --release --locked -p partly-server --target "$BINARY_TARGET"
      - name: Check that the Linux server has no dynamic dependencies
        if: runner.os == 'Linux'
        run: |
          readelf -d target/x86_64-unknown-linux-musl/release/partly > "$RUNNER_TEMP/partly-elf.txt"
          if grep -q NEEDED "$RUNNER_TEMP/partly-elf.txt"; then
            cat "$RUNNER_TEMP/partly-elf.txt"
            exit 1
          fi
      - name: Prepare the SDK source distribution
        run: |
          python -m pip install maturin==1.15.0
          cargo fetch --locked --manifest-path sdk/python/Cargo.toml
          CARGO_NET_OFFLINE=true maturin sdist --manifest-path sdk/python/Cargo.toml --out dist
          python scripts/prepare_sdist.py dist/*.tar.gz target/release-source
      - name: Build the CPython 3.14 wheel from its source distribution
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.wheel-target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: target/release-source
          args: --release --locked --compatibility pypi --out ../../dist -i python3.14
      - name: Check package metadata
        run: |
          python -m pip install twine
          python -m twine check --strict dist/*
      - name: Build and test standalone SDK packages
        env:
          BINARY_TARGET: ${{ matrix.binary-target }}
        run: |
          python -m pip install -r config/requirements-dev.txt dist/*.whl
          python scripts/package_sdks.py --output dist
          PARTLY_BINARY="$PWD/target/$BINARY_TARGET/release/partly" PARTLY_SDK_PACKAGES="$PWD/dist" python -m pytest -q tests/e2e/test_sdk_contract.py
      - name: Package the server and checksums
        env:
          BINARY_TARGET: ${{ matrix.binary-target }}
        run: |
          mkdir -p "$RUNNER_TEMP/partly-package"
          cp "target/$BINARY_TARGET/release/partly" LICENSE NOTICE licenses/THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/partly-package/"
          cp docs/licensing.md "$RUNNER_TEMP/partly-package/LICENSING.md"
          cp crates/partly-core/LICENSE "$RUNNER_TEMP/partly-package/LICENSE-APACHE"
          cp sdk/python/RUST_STDLIB_NOTICES.html "$RUNNER_TEMP/partly-package/"
          if [ "$RUNNER_OS" = Linux ]; then
            cp /usr/share/doc/musl-dev/copyright "$RUNNER_TEMP/partly-package/MUSL_NOTICES.txt"
          fi
          tar -czf "dist/partly-$BINARY_TARGET.tar.gz" -C "$RUNNER_TEMP/partly-package" .
          python - <<'PY'
          import hashlib
          from pathlib import Path

          directory = Path("dist")
          files = sorted(path for path in directory.iterdir() if path.is_file())
          (directory / "SHA256SUMS").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n" for path in files
          ))
          PY
      - name: Test the archived server and wheel outside the checkout
        env:
          BINARY_TARGET: ${{ matrix.binary-target }}
        run: |
          mkdir "$RUNNER_TEMP/partly-unpacked"
          tar -xzf "dist/partly-$BINARY_TARGET.tar.gz" -C "$RUNNER_TEMP/partly-unpacked"
          test -x "$RUNNER_TEMP/partly-unpacked/partly"
          for notice in LICENSE NOTICE; do
            cmp "$notice" "$RUNNER_TEMP/partly-unpacked/$notice"
          done
          cmp docs/licensing.md "$RUNNER_TEMP/partly-unpacked/LICENSING.md"
          cmp licenses/THIRD_PARTY_NOTICES.txt "$RUNNER_TEMP/partly-unpacked/THIRD_PARTY_NOTICES.txt"
          cmp crates/partly-core/LICENSE "$RUNNER_TEMP/partly-unpacked/LICENSE-APACHE"
          cmp sdk/python/RUST_STDLIB_NOTICES.html "$RUNNER_TEMP/partly-unpacked/RUST_STDLIB_NOTICES.html"
          if [ "$RUNNER_OS" = Linux ]; then
            cmp /usr/share/doc/musl-dev/copyright "$RUNNER_TEMP/partly-unpacked/MUSL_NOTICES.txt"
          fi
          python -m venv "$RUNNER_TEMP/partly-smoke"
          "$RUNNER_TEMP/partly-smoke/bin/python" -m pip install --only-binary=:all: dist/*.whl trustme packaging
          cp scripts/release_smoke.py "$RUNNER_TEMP/release_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/partly-smoke/bin/python" -I release_smoke.py "$RUNNER_TEMP/partly-unpacked/partly"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: partly-${{ matrix.binary-target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
