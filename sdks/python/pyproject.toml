[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "partly-sdk"
dynamic = ["version"]
description = "Local feature flag evaluation with an async Python client and Rust core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "certifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://partly.sh"
Documentation = "https://partly.sh/docs"
Download = "https://partly.sh/install"

[tool.maturin]
python-source = "python"
module-name = "partly._native"
