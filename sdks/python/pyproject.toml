[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "partly-sdk"
dynamic = ["version"]
description = "Local feature flag evaluation with an async Python client and Rust core"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.maturin]
python-source = "python"
module-name = "partly._native"
