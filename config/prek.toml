minimum_prek_version = "0.5.5"
default_install_hook_types = ["pre-push"]
default_stages = ["pre-push", "manual"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-merge-conflict" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "rust-format"
name = "Rust formatting"
language = "system"
entry = "cargo fmt --all --check"
files = '(\.rs$|(^|/)Cargo\.toml$|^\.rustfmt\.toml$)'
pass_filenames = false

[[repos.hooks]]
id = "python-lint"
name = "Python lint"
language = "system"
entry = "task hook:python --"
types_or = ["python", "pyi"]

[[repos.hooks]]
id = "go-format"
name = "Go formatting"
language = "system"
entry = "sh scripts/check_gofmt.sh"
types = ["go"]

[[repos.hooks]]
id = "frontend-lint"
name = "JavaScript, HTML and CSS lint"
language = "system"
entry = "npm run lint"
files = '(\.(js|mjs|ts|html|css)$|^config/|(^|/)package(-lock)?\.json$)'
exclude = '(^|/)RUST_STDLIB_NOTICES\.html$'
pass_filenames = false

[[repos.hooks]]
id = "shell-lint"
name = "Shell lint"
language = "system"
entry = "task hook:shell --"
types = ["shell"]

[[repos.hooks]]
id = "workflow-security"
name = "GitHub Actions security"
language = "system"
entry = "task lint:workflows"
files = '^\.github/|^config/(prek\.toml|requirements-dev\.txt)$|^Taskfile\.yml$'
pass_filenames = false

[[repos.hooks]]
id = "release-versions"
name = "Release version consistency"
language = "system"
entry = "task hook:versions"
files = '(^|/)(Cargo\.(toml|lock)|pyproject\.toml|package\.json|go\.mod)$|^tests/test_release_versions\.py$'
pass_filenames = false

[[repos.hooks]]
id = "audit-rust"
name = "Rust vulnerabilities"
language = "system"
entry = "task audit:rust"
stages = ["pre-push"]
always_run = true
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "audit-python"
name = "Python vulnerabilities"
language = "system"
entry = "task audit:python"
stages = ["pre-push"]
always_run = true
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "audit-go"
name = "Go vulnerabilities"
language = "system"
entry = "task audit:go"
stages = ["pre-push"]
always_run = true
pass_filenames = false
priority = 100

[[repos.hooks]]
id = "audit-node"
name = "npm vulnerabilities"
language = "system"
entry = "task audit:node"
stages = ["pre-push"]
always_run = true
pass_filenames = false
priority = 100
