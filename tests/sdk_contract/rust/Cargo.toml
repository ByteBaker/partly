[package]
name = "partly-sdk-contract"
version = "0.0.0"
edition = "2021"
publish = false

# The driver must build separately while sdk/rust is still missing.
[dependencies]
partly = { package = "partly-rust", path = "../../../sdk/rust" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
