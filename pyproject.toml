[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E9", "F", "B", "I", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["partly"]

[tool.ruff.lint.per-file-ignores]
# Language drivers may call synchronous APIs while the Rust harness owns the server.
"tests/**/*.py" = ["ASYNC"]

[tool.mypy]
python_version = "3.14"
files = ["sdk/python/python", "examples/python", "scripts"]
mypy_path = "sdk/python/python"
strict = true

[tool.pytest.ini_options]
testpaths = ["sdk/python/tests", "tests"]
asyncio_mode = "auto"
