[workspace]
members = [
    "crates/partly-server",
    "crates/partly-ffi",
    "sdk/python",
    "sdk/rust",
    "sdk/node",
    "tests/sdk_contract/rust",
    "tests/e2e",
]
default-members = ["sdk/rust", "crates/partly-server"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
repository = "https://github.com/ByteBaker/partly"
publish = false

[workspace.dependencies]
partly = { package = "partly-rust", path = "sdk/rust", version = "=0.1.0-alpha.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
