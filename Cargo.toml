[workspace]
members = ["crates/partly-core", "crates/partly-server", "sdk/python"]
default-members = ["crates/partly-core", "crates/partly-server"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
publish = false

[workspace.dependencies]
partly-core = { path = "crates/partly-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[profile.release]
lto = "thin"
strip = true
