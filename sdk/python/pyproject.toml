[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "partly-sdk"
dynamic = ["version"]
description = "Local feature flag evaluation with an async Python client and Rust core"
readme = "README.md"
# The native extension also includes MIT-licensed dependencies.
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt", "RUST_STDLIB_NOTICES.html"]
requires-python = ">=3.14,<3.15"
dependencies = ["httpx>=0.27,<1", "certifi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.urls]
Homepage = "https://partly.sh"
Documentation = "https://partly.sh/docs"
Download = "https://partly.sh/install"

[tool.maturin]
python-source = "python"
module-name = "partly._native"
