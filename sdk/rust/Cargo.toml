[package]
name = "partly-rust"
version.workspace = true
edition.workspace = true
publish = true
license = "Apache-2.0"
description = "Async policy downloads and local feature flag evaluation for Partly"
readme = "README.md"
rust-version = "1.89"

[lib]
name = "partly"

[dependencies]
partly-core.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[[example]]
name = "quickstart"
path = "../../examples/rust/quickstart.rs"
