[package]
name = "partly-rust"
version.workspace = true
edition.workspace = true
publish = true
license = "Apache-2.0"
description = "Async policy downloads and local feature flag evaluation for Partly"
readme = "README.md"
rust-version = "1.89"

[lib]
name = "partly"

[features]
openfeature = ["dep:open-feature", "dep:async-trait", "dep:serde_json"]

[dependencies]
partly-core.workspace = true
thiserror.workspace = true
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
url = "2.5.8"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
open-feature = { version = "0.3.0", optional = true }
async-trait = { version = "0.1", optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[[example]]
name = "quickstart"
path = "../../examples/rust/quickstart.rs"
required-features = ["openfeature"]

[[example]]
name = "openfeature-contract"
path = "../../tests/sdk_contract/rust/openfeature.rs"
required-features = ["openfeature"]
