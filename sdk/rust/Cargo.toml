[package]
name = "partly-rust"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = true
license = "Apache-2.0"
description = "Async policy downloads and local feature flag evaluation for Partly"
readme = "README.md"
rust-version = "1.89"

[lib]
name = "partly"

[features]
default = ["client"]
client = ["dep:reqwest", "dep:url", "dep:tokio"]
openfeature = ["client", "dep:open-feature", "dep:async-trait"]
openapi = ["dep:utoipa"]

[dependencies]
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true
regex = "1.13.1"
regex-syntax = "0.8.11"
utoipa = { version = "6.0.0", optional = true }
reqwest = { version = "0.12.28", optional = true, default-features = false, features = ["rustls-tls-webpki-roots"] }
url = { version = "2.5.8", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "sync", "time", "macros"] }
open-feature = { version = "0.3.0", optional = true }
async-trait = { version = "0.1", optional = true }
serde_json = { workspace = true, features = ["raw_value", "float_roundtrip"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }

[[test]]
name = "client"
required-features = ["client"]

[[example]]
name = "quickstart"
path = "../../examples/rust/quickstart.rs"
required-features = ["openfeature"]

[[example]]
name = "openfeature-contract"
path = "../../tests/sdk_contract/rust/openfeature.rs"
required-features = ["openfeature"]

[[example]]
name = "typed-results"
path = "../../examples/rust/typed_results.rs"
required-features = ["openfeature"]
