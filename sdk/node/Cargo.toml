[package]
name = "partly-node"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
partly-ffi = { path = "../../crates/partly-ffi" }
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
